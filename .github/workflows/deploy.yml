name: Despliegue de CV Ejecutivo Inteligente en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages mediante OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Control de concurrencia:
# Evita choques entre despliegues sucesivos.
# 'cancel-in-progress: false' asegura que los despliegues se completen ordenadamente en fila,
# previniendo el error HttpError 400 por despliegues simultaneos.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
